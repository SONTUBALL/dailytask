<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Task Tally Counter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        /* Custom smooth active scale effect for touch buttons */
        .touch-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-10">
        <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-calculator text-xl"></i>
                <h1 class="text-lg font-bold tracking-wide">Daily Task Tally</h1>
            </div>
            <div class="flex items-center space-x-3">
                <span id="current-date" class="text-xs bg-indigo-700 px-2.5 py-1 rounded-full font-medium"></span>
                <button onclick="promptReset()" class="bg-indigo-700 hover:bg-indigo-800 text-white text-xs px-2.5 py-1.5 rounded-lg transition font-medium flex items-center space-x-1">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span>Reset</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-6 w-full flex-grow">
        <!-- Summary Card -->
        <div class="bg-gradient-to-br from-indigo-500 to-violet-600 rounded-2xl p-5 text-white shadow-lg mb-6 flex justify-between items-center">
            <div>
                <p class="text-xs uppercase tracking-wider text-indigo-200 font-semibold">Total Actions Today</p>
                <h2 id="total-count" class="text-4xl font-extrabold mt-1">0</h2>
            </div>
            <div class="w-12 h-12 bg-white/15 backdrop-blur-sm rounded-full flex items-center justify-center text-xl">
                <i class="fa-solid fa-chart-line"></i>
            </div>
        </div>

        <!-- Add Custom Task Form -->
        <form id="add-task-form" onsubmit="addCustomTask(event)" class="mb-5 flex gap-2">
            <input type="text" id="new-task-input" placeholder="Add new custom task..." autocomplete="off"
                class="flex-grow bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-3 rounded-xl font-medium text-sm transition shadow-sm flex items-center justify-center">
                <i class="fa-solid fa-plus"></i>
            </button>
        </form>

        <!-- Task List Container -->
        <div id="task-list" class="space-y-3 pb-6">
            <!-- Populated dynamically via JavaScript -->
        </div>
    </main>

    <div id="reset-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-xs w-full p-6 shadow-2xl transform transition-all scale-95 opacity-0" id="modal-content">
            <div class="w-12 h-12 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center text-xl mb-4 mx-auto">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 class="text-lg font-bold text-center text-slate-800">Restart Application?</h3>
            <p class="text-xs text-slate-500 text-center mt-1 mb-6">Are you sure you want to refresh? All today's counts will be cleared permanently.</p>
            <div class="flex space-x-3">
                <button onclick="closeModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 rounded-xl text-sm transition">No</button>
                <button onclick="executeReset()" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-medium py-2.5 rounded-xl text-sm transition shadow-sm">Yes, Clear</button>
            </div>
        </div>
    </div>

    <script>
        // Default tasks matching user requirements (Nirvana banner removed)
        const defaultTasks = [
            { id: 'task-1', name: 'Customer Call Attend', count: 0 },
            { id: 'task-2', name: 'Customer Site Visit', count: 0 },
            { id: 'task-3', name: 'Video Editing', count: 0 },
            { id: 'task-5', name: 'Details Send to Client', count: 0 }
        ];

        let tasks = [];
        let taskToDeleteId = null; // Track which custom task is pending deletion

        // Load tasks from localStorage or initialize defaults
        function loadData() {
            const savedData = localStorage.getItem('daily_tally_tasks');
            if (savedData) {
                try {
                    tasks = JSON.parse(savedData);
                } catch (e) {
                    tasks = defaultTasks;
                }
            } else {
                tasks = JSON.parse(JSON.stringify(defaultTasks));
            }
            renderUI();
        }

        // Save current tasks state to localStorage
        function saveData() {
            localStorage.setItem('daily_tally_tasks', JSON.stringify(tasks));
        }

        // Format today's date in header
        function updateDate() {
            const options = { month: '2-digit', day: '2-digit', year: 'numeric' };
            const today = new Date().toLocaleDateString(undefined, options);
            document.getElementById('current-date').innerText = today;
        }

        // Increment count for specific task ID
        function incrementTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.count += 1;
                saveData();
                renderUI();
            }
        }

        // Decrement/Undo count for specific task ID (cannot go below 0)
        function decrementTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task && task.count > 0) {
                task.count -= 1;
                saveData();
                renderUI();
            }
        }

        // Add custom task from input form
        function addCustomTask(event) {
            event.preventDefault();
            const input = document.getElementById('new-task-input');
            const taskName = input.value.trim();
            if(!taskName) return;

            const newTask = {
                id: 'custom-' + Date.now(),
                name: taskName,
                count: 0
            };

            tasks.push(newTask);
            input.value = '';
            saveData();
            renderUI();
        }

        // Prompt confirmation before deleting a custom task
        function promptDeleteTask(id) {
            taskToDeleteId = id;
            const modal = document.getElementById('reset-modal');
            const content = document.getElementById('modal-content');
            
            // Customize modal for task deletion
            content.querySelector('h3').innerText = "Delete Custom Task?";
            content.querySelector('p').innerText = "Are you sure you want to delete this task? This cannot be undone.";
            const yesBtn = content.querySelector('button.bg-rose-600');
            yesBtn.setAttribute('onclick', 'executeDeleteTask()');

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        // Execute task deletion after confirmation
        function executeDeleteTask() {
            if (taskToDeleteId) {
                tasks = tasks.filter(t => t.id !== taskToDeleteId);
                saveData();
                taskToDeleteId = null;
            }
            closeModal();
            renderUI();
        }

        // Open modal confirmation for resetting data
        function promptReset() {
            taskToDeleteId = null; // Ensure we are in reset mode, not delete mode
            const modal = document.getElementById('reset-modal');
            const content = document.getElementById('modal-content');
            
            // Customize modal for app reset
            content.querySelector('h3').innerText = "Restart Application?";
            content.querySelector('p').innerText = "Are you sure you want to refresh? All today's counts will be cleared permanently.";
            const yesBtn = content.querySelector('button.bg-rose-600');
            yesBtn.setAttribute('onclick', 'executeReset()');

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        // Close modal without resetting or deleting
        function closeModal() {
            const modal = document.getElementById('reset-modal');
            const content = document.getElementById('modal-content');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
                taskToDeleteId = null;
            }, 150);
        }

        // Execute reset when 'Yes' is clicked
        function executeReset() {
            localStorage.removeItem('daily_tally_tasks');
            tasks = JSON.parse(JSON.stringify(defaultTasks));
            closeModal();
            renderUI();
        }

        // Render the UI elements based on current state
        function renderUI() {
            const container = document.getElementById('task-list');
            container.innerHTML = '';

            let totalActions = 0;

            tasks.forEach(task => {
                totalActions += task.count;

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex flex-col justify-between transition hover:shadow-md";

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <span class="text-sm font-semibold text-slate-700 leading-snug pr-2">${task.name}</span>
                        ${task.id.startsWith('custom-') ? `
                            <button onclick="promptDeleteTask('${task.id}')" class="text-slate-400 hover:text-rose-500 transition text-xs p-1" title="Remove task">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        ` : ''}
                    </div>
                    <div class="flex items-center justify-between mt-1">
                        <div class="flex items-baseline space-x-1.5">
                            <span class="text-3xl font-black text-indigo-600">${task.count}</span>
                            <span class="text-xs text-slate-400 font-medium">taps</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="decrementTask('${task.id}')" class="touch-btn w-10 h-10 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl flex items-center justify-center font-bold text-sm transition shadow-sm" title="Undo / Minus 1">
                                <i class="fa-solid fa-minus"></i>
                            </button>
                            <button onclick="incrementTask('${task.id}')" class="touch-btn w-12 h-12 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl flex items-center justify-center font-bold text-lg transition shadow-md shadow-indigo-200" title="Add 1">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('total-count').innerText = totalActions;
        }

        // Initialize on load
        window.onload = function() {
            updateDate();
            loadData();
        };
    </script>
</body>
</html>
